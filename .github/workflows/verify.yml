name: verify

# PR 必过：这个 workflow 是合并门槛，任何一步非 0 退出即阻断。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 Node 22：覆盖率阈值是用 v8 provider 在本版本上实测的，
      # 换大版本会因语句/分支计数差异导致假红或假绿。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 使用 lockfile 的确定性安装；lockfile 已入库，缺失即失败。
      - name: Install dependencies
        run: npm ci

      # verify 内部按顺序执行：
      # lint → lint:style → format:check → typecheck → assets:check:strict
      # → test:coverage（含阈值）→ build
      - name: Verify
        run: npm run verify

      # 独立检查浏览器，放在体积门禁之前。
      # 为什么单独一步：「缺 Chrome」和「体积超预算」是两类问题，
      # 混成同一个红之后，看日志的人要先猜是环境坏了还是代码坏了。
      - name: Check Chrome availability
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              echo "找到浏览器：$(command -v "$bin")"
              exit 0
            fi
          done
          echo "::error title=环境缺失::未找到 Chrome/Chromium。本步失败代表 runner 缺浏览器，不是首屏体积门禁判错。"
          echo "修复：在 runner 上安装 google-chrome-stable，或设置 CHROME_PATH 指向可执行文件。"
          exit 1

      # 先自验门禁本身（会红/会绿/会拒判），再拿它去判构建产物。
      # 顺序不能反：门禁坏了却先跑门禁，只会得到一条无法解释的红。
      - name: First-load budget selftest
        run: npm run perf:budget:selftest

      # 门禁本体：退出码 0=通过 1=超预算 2=无法判定（环境/口径问题）
      - name: First-load size budget
        run: npm run perf:budget
